<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunter System</title>
<meta name="theme-color" content="#05070d">
<meta name="description" content="A Solo Leveling style habit tracker. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one roomy column of glowing "system windows", one tab at a time, fixed bottom nav. Single dark theme by choice; store themes swap the glow colour. */
:root{
  --bg:#04060c;
  --panel:rgba(9,18,38,.84);
  --g:88,196,255;
  --l:47,107,255;
  --n:127,144,181;
  --glow:rgb(var(--g));
  --line:rgb(var(--l));
  --text:#dce8ff;
  --muted:#8494b8;
  --danger:#ff4d6d;
  --good:#6fdc8c;
  --gold:#ffcc55;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
/* Themes set on the root so every derived colour (--glow, --line, text, greys) is recomputed */
:root[data-th="crimson"]{--g:255,92,120;--l:200,20,60;--n:176,138,146;--panel:rgba(30,8,14,.86);--bg:#0c0406;--text:#ffe4ea;--muted:#b98d97;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="violet"]{--g:186,140,255;--l:110,50,230;--n:150,138,180;--panel:rgba(18,10,36,.86);--bg:#07040e;--text:#ece4ff;--muted:#9d90bd;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="gold"]{--g:255,214,110;--l:214,150,20;--n:178,160,120;--panel:rgba(28,22,8,.86);--bg:#0a0803;--text:#fff4dc;--muted:#bba884;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="obsidian"]{--g:232,232,238;--l:90,90,104;--n:130,130,140;--panel:rgba(6,6,8,.94);--bg:#000;--text:#f4f4f7;--muted:#8e8e98;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="ember"]{--g:255,122,26;--l:190,60,0;--n:150,120,100;--panel:rgba(12,6,3,.93);--bg:#030100;--text:#fff0e2;--muted:#b0917a;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="neon"]{--g:255,61,242;--l:150,20,190;--n:150,120,160;--panel:rgba(10,3,14,.93);--bg:#020005;--text:#ffe8fd;--muted:#a88ab0;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="toxic"]{--g:157,255,46;--l:60,150,10;--n:120,150,110;--panel:rgba(4,10,3,.93);--bg:#010300;--text:#efffe0;--muted:#8fa883;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="sakura"]{--g:255,143,199;--l:190,50,120;--n:160,128,145;--panel:rgba(14,5,10,.92);--bg:#050104;--text:#ffeef7;--muted:#b293a5;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="blackice"]{--g:127,246,255;--l:20,130,170;--n:120,150,160;--panel:rgba(2,8,12,.94);--bg:#000204;--text:#e6fdff;--muted:#86a6ae;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="bloodmoon"]{--g:255,31,61;--l:120,0,16;--n:140,110,114;--panel:rgba(6,0,1,.95);--bg:#000;--text:#ffe9ec;--muted:#a68288;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="abyss"]{--g:255,70,70;--l:150,12,24;--n:160,120,124;--panel:rgba(22,4,6,.9);--bg:#070102;--text:#ffe6e6;--muted:#b08a8c;--glow:rgb(var(--g));--line:rgb(var(--l))}
:root[data-th="jade"]{--g:110,240,190;--l:20,160,120;--n:124,168,152;--panel:rgba(6,26,22,.86);--bg:#030a08;--text:#e0fff3;--muted:#84ab9c;--glow:rgb(var(--g));--line:rgb(var(--l))}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
body{min-height:100%;background:radial-gradient(900px 500px at 50% -10%,rgba(var(--l),.22),transparent 70%),radial-gradient(600px 400px at 100% 100%,rgba(var(--g),.07),transparent 70%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 110px;display:flex;flex-direction:column;gap:22px}

.win{position:relative;background:var(--panel);border:1px solid rgba(var(--g),.38);box-shadow:0 0 0 1px rgba(var(--l),.18) inset,0 0 22px rgba(var(--l),.18);border-radius:6px;padding:20px 18px;animation:rise .35s ease both}
.win::before,.win::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--glow)}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win.redwin{border-color:rgba(255,77,109,.6);box-shadow:0 0 0 1px rgba(255,77,109,.18) inset,0 0 24px rgba(255,77,109,.26);background:rgba(34,6,14,.88)}
.win.redwin::before,.win.redwin::after{border-color:var(--danger)}
.win.redwin .tag{color:var(--danger);border-color:var(--danger);background:rgba(255,77,109,.1);text-shadow:0 0 8px rgba(255,77,109,.6)}
.win.redwin .check{border-color:rgba(255,77,109,.8)}
.win.redwin .q.done .check{background:var(--danger);box-shadow:0 0 12px var(--danger)}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.win-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 16px;flex-wrap:wrap}
.tag{font-family:var(--display);font-weight:600;letter-spacing:.14em;font-size:.8rem;color:var(--glow);text-transform:uppercase;border:1px solid rgba(var(--g),.5);padding:3px 10px;border-radius:2px;background:rgba(var(--g),.08);text-shadow:0 0 8px rgba(var(--g),.6)}
.sub{color:var(--muted);font-size:.86rem}
.btn{background:rgba(var(--l),.16);border:1px solid rgba(var(--g),.5);border-radius:4px;padding:7px 13px;font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:.82rem;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(var(--l),.32)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:rgba(var(--n),.4);color:var(--muted)}
.btn.danger{border-color:rgba(255,77,109,.6);color:#ffb3c1;background:rgba(255,77,109,.1)}
.btn.primary{background:linear-gradient(180deg,rgba(var(--l),1),rgba(var(--l),.7));border-color:var(--glow);box-shadow:0 0 14px rgba(var(--l),.45);color:#fff}
.btn.goldb{border-color:rgba(255,204,85,.7);color:#ffe3a3;background:rgba(255,204,85,.1)}
.btn.sm{padding:4px 10px;font-size:.74rem}
.link{background:none;border:0;padding:2px 0;color:var(--muted);font-size:.84rem;text-decoration:underline;text-underline-offset:3px}
.how{margin-top:14px;font-size:.84rem;color:var(--muted)}
.how summary{cursor:pointer;font-family:var(--display);letter-spacing:.08em;font-size:.74rem;text-transform:uppercase;list-style:none;display:inline-flex;align-items:center;gap:6px}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"i";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid currentColor;font-size:.66rem;font-style:italic;text-transform:none}
.how p{margin:8px 0 0}

/* Header */
.hdr{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.lvl{width:62px;height:62px;display:grid;place-items:center;text-align:center;border:1px solid rgba(var(--g),.6);border-radius:5px;background:rgba(var(--l),.12)}
.lvl small{display:block;font-family:var(--display);font-size:.6rem;letter-spacing:.2em;color:var(--muted)}
.lvl b{font-family:var(--display);font-size:1.85rem;line-height:1;color:#fff;text-shadow:0 0 14px rgba(var(--g),.9)}
.who{min-width:0}
.ib .badge{position:absolute}
.name{display:block;font-family:var(--display);font-weight:700;font-size:1.2rem;background:none;border:0;padding:0;text-align:left;color:#fff;overflow-wrap:anywhere}
.title-line{font-size:.8rem;color:var(--glow)}
.rank{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.08em}
.rank i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:3px;border:1px solid currentColor;font-size:.85rem}
.r-E{color:#9aa6bf}.r-D{color:#6fdc8c}.r-C{color:#58c4ff}.r-B{color:#b48cff}.r-A{color:#ff9a4d}.r-S{color:var(--gold);text-shadow:0 0 10px rgba(255,204,85,.6)}.r-SS{color:#ff4d6d;text-shadow:0 0 10px rgba(255,77,109,.7)}.r-SSS{color:#fff;text-shadow:0 0 10px #b88cff,0 0 18px #58c4ff}.rank.r-SSS i,.rank.r-SS i{width:auto;padding:0 4px}
.icons{display:flex;gap:6px}
.ttls{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ttl{font-family:var(--display);font-size:.68rem;letter-spacing:.06em;padding:1px 7px;border:1px solid currentColor;border-radius:3px;background:rgba(0,0,0,.3);white-space:nowrap}
button.ttl{cursor:pointer;font-size:.74rem;padding:3px 9px}
.ttl.t2{box-shadow:0 0 8px rgba(180,140,255,.35)}.ttl.t3{box-shadow:0 0 10px rgba(255,204,85,.45);text-shadow:0 0 6px rgba(255,204,85,.6)}
.ttl.t4{box-shadow:0 0 12px rgba(255,77,109,.55);text-shadow:0 0 8px rgba(255,77,109,.8);animation:myth 2.4s ease-in-out infinite}
@keyframes myth{50%{box-shadow:0 0 20px rgba(255,77,109,.9);filter:hue-rotate(25deg)}}
.ttl.on{background:rgba(255,255,255,.1)}
.ttl.lock{color:var(--muted);border-style:dashed;opacity:.6}
.tierkey{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--display);font-size:.72rem;letter-spacing:.08em;margin-bottom:14px}
.trks{display:flex;flex-direction:column;gap:16px}
.trk-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:.9rem}
.trk-h b{font-weight:600}
.bar.thin{height:5px;margin:6px 0 8px}
.tchain{display:flex;flex-wrap:wrap;gap:6px}
.ib{width:34px;height:34px;border-radius:4px;border:1px solid rgba(var(--n),.35);background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.ib svg{width:18px;height:18px}
.xp{margin-top:14px}
.xp-row{display:flex;justify-content:space-between;font-family:var(--display);font-size:.76rem;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.bar{height:8px;border:1px solid rgba(var(--g),.45);border-radius:2px;margin-top:5px;background:rgba(0,0,0,.4);overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 12px var(--glow);transition:width .6s ease}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-family:var(--display);font-size:.76rem;letter-spacing:.05em;padding:3px 9px;border-radius:3px;border:1px solid rgba(var(--n),.3);color:var(--muted);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.chip b{color:var(--text)}
.chip.hot{border-color:rgba(255,154,77,.55);color:#ffc89e}
.chip.gold{border-color:rgba(255,204,85,.55);color:#ffe3a3}
.chip.gold b{color:var(--gold)}
.chip.red{border-color:rgba(255,77,109,.5)}
.coin{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#ffcc55 45%,#b07a10);box-shadow:0 0 6px rgba(255,204,85,.7);display:inline-block;flex:none}
.heart{display:inline-block;width:12px;height:12px;flex:none;background:var(--danger);clip-path:path("M6 11 L1 6 A2.8 2.8 0 0 1 6 2.2 A2.8 2.8 0 0 1 11 6 Z")}
.heart.used{background:rgba(var(--n),.35)}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(4,6,12,.95);border-top:1px solid rgba(var(--g),.3);box-shadow:0 -6px 24px rgba(var(--l),.16);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;max-width:560px}
.nav button{background:none;border:0;padding:11px 1px 13px;font-family:var(--display);font-weight:600;font-size:.62rem;letter-spacing:.06em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--glow);text-shadow:0 0 8px rgba(var(--g),.7)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:20%;right:20%;height:2px;background:var(--glow);box-shadow:0 0 10px var(--glow)}
.badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:.64rem;display:grid;place-items:center;padding:0 4px;letter-spacing:0}

.seg{display:flex;border:1px solid rgba(var(--g),.3);border-radius:4px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;background:transparent;border:0;padding:9px;font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.08em;color:var(--muted)}
.seg button[aria-selected="true"]{background:rgba(var(--l),.28);color:#fff}
.seg button+button{border-left:1px solid rgba(var(--g),.3)}

/* Quests */
.quest-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 12px;border:1px solid rgba(var(--g),.12);border-left:3px solid rgba(var(--n),.5);border-radius:4px 8px 8px 4px;background:linear-gradient(90deg,rgba(var(--l),.08),rgba(0,0,0,.2));transition:border-color .15s,background .15s}
.q.rk-D{border-left-color:#6fdc8c}.q.rk-C{border-left-color:#58c4ff}.q.rk-B{border-left-color:#b48cff}.q.rk-A{border-left-color:#ff9a4d}.q.rk-S{border-left-color:#ffcc55}
.q-acts{display:flex;gap:6px;align-items:center}
.mini-sq{min-width:44px;height:32px;border-radius:16px;border:1.5px solid rgba(255,204,85,.75);background:linear-gradient(180deg,rgba(255,204,85,.22),rgba(255,204,85,.06));color:var(--gold);font-family:var(--display);padding:0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;box-shadow:0 0 8px rgba(255,204,85,.18)}
.q-mini{margin-top:4px;font-size:.78rem;color:rgba(255,224,150,.85);display:flex;gap:6px;align-items:baseline}.q-mini b{font-family:var(--display);font-size:.58rem;letter-spacing:.14em;color:var(--gold);border:1px solid rgba(255,204,85,.5);border-radius:3px;padding:0 4px}.q-mini.on{color:var(--gold)}
.mini-sq span{font-weight:700;font-size:.66rem;letter-spacing:.14em}.mini-sq small{font-size:.54rem;color:rgba(255,224,150,.8);letter-spacing:.02em;max-width:60px;overflow:hidden;white-space:nowrap}
.mini-sq:hover{background:rgba(255,204,85,.28)}
.q.minidone .check{background:linear-gradient(135deg,var(--gold) 50%,rgba(255,204,85,.25) 50%);border-color:var(--gold)}.q.minidone{border-color:rgba(255,204,85,.45)}
.q-xp small{font-size:.56rem;margin-left:2px;opacity:.75}.q-xp em{display:block;font-style:normal;font-size:.62rem;color:var(--gold);text-align:center;margin-top:1px}
.q-xp{text-align:center;font-family:var(--display);font-size:.78rem;color:var(--glow);background:rgba(var(--g),.1);border:1px solid rgba(var(--g),.25);border-radius:12px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.q.done{border-color:rgba(var(--g),.45);background:rgba(var(--l),.12)}
.q.vanish{animation:vanish .28s ease-in forwards;pointer-events:none}
@keyframes vanish{to{transform:translateX(24px);opacity:0}}
.check{width:32px;height:32px;border-radius:6px;border:1.5px solid rgba(var(--g),.7);background:transparent;display:grid;place-items:center;padding:0}
.q.done .check,.q.vanish .check{background:var(--glow)}
.check svg{width:18px;height:18px;opacity:0}
.q.done .check svg,.q.vanish .check svg{opacity:1}
.q-main{min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.q-name{font-weight:600;overflow-wrap:anywhere;font-size:1rem}
.q-meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:2px}
.q-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.q-xp{font-family:var(--display);font-size:.8rem;color:var(--glow);white-space:nowrap;font-variant-numeric:tabular-nums}
.tworn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}
.tslot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:8px;border:1px solid var(--tc,rgba(var(--g),.2));background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--tc,#fff) 22%,transparent),rgba(0,0,0,.3) 70%);text-align:center;min-height:62px}
.tslot b{font-family:var(--display);font-size:.72rem;letter-spacing:.04em;color:var(--tc)}.tslot.empty{border-style:dashed;border-color:rgba(var(--g),.2);color:var(--muted);font-size:.7rem;justify-content:center;background:none}
.tgem{width:18px;height:18px;flex:none;filter:drop-shadow(0 0 4px var(--tc,transparent))}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tcard{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--tc);background:rgba(0,0,0,.3)}
.tcard span{display:flex;flex-direction:column;min-width:0}.tcard b{font-family:var(--display);font-size:.78rem;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tcard small{font-size:.64rem;color:var(--muted);letter-spacing:.06em}
.tcard.on{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 18%,transparent),rgba(0,0,0,.3));box-shadow:0 0 10px color-mix(in srgb,var(--tc) 30%,transparent)}
.tnextc{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px;border-radius:8px;border:1px dashed color-mix(in srgb,var(--tc) 50%,transparent)}.tnextc>div{flex:1;display:flex;flex-direction:column;gap:3px}.tnextc small{font-family:var(--display);font-size:.6rem;letter-spacing:.18em;color:var(--muted)}.tnextc b{font-family:var(--display);color:var(--tc)}.tnextc .tgem{width:24px;height:24px}
.gear .pv{position:relative}.rkb{position:absolute;top:6px;right:6px;font-family:var(--display);font-weight:700;font-size:.66rem;letter-spacing:.04em;min-width:20px;height:20px;padding:0 4px;display:grid;place-items:center;border-radius:3px;border:1px solid currentColor;background:rgba(0,0,0,.65)}
.rkb.inl{position:static;display:inline-grid;margin-right:6px;vertical-align:1px;height:18px;min-width:18px;font-size:.6rem}
.rk-E{color:#a7b0c2}.rk-D{color:#6fdc8c}.rk-C{color:#58c4ff}.rk-B{color:#b48cff}.rk-A{color:#ff9a4d}.rk-S{color:#ffcc55;box-shadow:0 0 8px rgba(255,204,85,.45)}.rk-SS{color:#ff4d6d;box-shadow:0 0 8px rgba(255,77,109,.5)}.rk-SSS{color:#fff;border-color:#b88cff;box-shadow:0 0 10px #b88cff}
.rkdesc{margin:-4px 0 10px;font-size:.78rem;line-height:1.4}
.mansteps{margin:6px 0 12px;padding-left:20px;font-size:.86rem;line-height:1.5;color:var(--muted)}.mansteps b{color:var(--text)}
#manreply,#manone{width:100%;margin:10px 0;font-family:inherit;font-size:.86rem;background:rgba(0,0,0,.4);color:var(--text);border:1px solid rgba(var(--g),.3);border-radius:6px;padding:8px 10px}

/* Prayers */
.pray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}

.pp.late{border-color:var(--gold);color:var(--gold);background:rgba(255,204,85,.1)}

/* Character */
.char{display:flex;flex-direction:column;gap:16px}

.chart{width:100%;height:auto;display:block}

.srank{font-family:var(--display);font-weight:700;font-size:.7rem;letter-spacing:.14em;padding:2px 8px;border-radius:3px;border:1px solid currentColor}
.sr-E{color:#a7b0c2}.sr-D{color:#6fdc8c}.sr-C{color:#58c4ff}.sr-B{color:#b48cff}.sr-A{color:#ff9a4d}.sr-S{color:#ffcc55;text-shadow:0 0 8px rgba(255,204,85,.6)}.sr-SS{color:#ff4d6d;text-shadow:0 0 10px rgba(255,77,109,.7)}

.setcard{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center;border:1px solid rgba(var(--g),.18);border-radius:6px;background:rgba(0,0,0,.25);padding:10px}

.setcard .pv{border:0;background:none;padding:0;cursor:zoom-in}.setcard .pv svg{width:130px;height:auto;border-radius:6px}
.setinfo{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.setinfo b{font-family:var(--display);font-size:1rem;letter-spacing:.04em}
.setparts{display:flex;flex-wrap:wrap;gap:4px}.setparts span{font-size:.7rem;color:var(--muted);border:1px solid rgba(var(--n),.3);border-radius:3px;padding:1px 6px}
.armory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gear{border:1px solid rgba(var(--g),.18);border-radius:6px;background:rgba(0,0,0,.25);padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left}
.gear.eq{border-color:var(--glow);box-shadow:0 0 12px rgba(var(--g),.35)}
.gear .pv{display:grid;place-items:center;background:rgba(var(--l),.08);border-radius:6px;padding:4px;border:0;cursor:zoom-in}
.gear .pv svg{width:100%;max-width:130px;height:auto;border-radius:6px}
.gear b{font-family:var(--display);font-size:.86rem;letter-spacing:.03em}
.gear .gd{font-size:.74rem;color:var(--muted);min-height:2.2em}
.gear .gb{display:flex;justify-content:space-between;align-items:center;gap:6px}
.gear .gb span{font-family:var(--display);color:var(--gold);font-size:.8rem;display:inline-flex;align-items:center;gap:4px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.hist li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--muted);border-bottom:1px solid rgba(var(--n),.12);padding-bottom:8px}
.hist li b{color:var(--text);font-weight:500}
.hist .d{font-family:var(--display);font-size:.78rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.kind{font-family:var(--display);font-size:.64rem;letter-spacing:.1em;padding:0 5px;border-radius:2px;border:1px solid currentColor;margin-right:6px}
.k-achievement{color:var(--gold)}.k-improvement{color:var(--good)}.k-event{color:var(--glow)}.k-gate{color:#b48cff}

/* Advisor */
.adv{display:flex;flex-direction:column;gap:10px}
.sug{border:1px solid rgba(var(--g),.2);border-left:3px solid var(--glow);border-radius:4px;background:rgba(0,0,0,.22);padding:12px 14px}
.sug b{display:block;font-family:var(--display);letter-spacing:.03em}
.sug p{margin:4px 0 0;font-size:.88rem;color:var(--muted)}
.sug .row{margin-top:10px;justify-content:flex-start}
.sug.done{border-left-color:var(--good);opacity:.75}
.sug.rule{border-left-color:var(--gold)}
.headline{font-family:var(--display);font-size:1.05rem;color:#fff;margin:0 0 12px;text-wrap:balance}
.thinking{display:flex;align-items:center;gap:10px;color:var(--glow);font-family:var(--display);letter-spacing:.1em;font-size:.82rem}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--glow);margin-right:4px;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:.2;transform:translateY(-3px)}}

/* Battle */
.battle-today{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vbtn{padding:18px 8px;border-radius:5px;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:1rem;border:1px solid;background:transparent}
.vbtn.win{border-color:var(--glow);color:#fff;background:linear-gradient(180deg,rgba(var(--l),.6),rgba(var(--l),.25));box-shadow:0 0 18px rgba(var(--l),.45)}
.vbtn.lose{border-color:rgba(var(--n),.4);color:var(--muted)}
.bstatus{text-align:center;padding:16px;border-radius:5px;font-family:var(--display);letter-spacing:.12em}
.bstatus b{display:block;font-size:1.5rem;margin-bottom:2px}
.bstatus.w{border:1px solid var(--glow);background:rgba(var(--g),.12)}
.bstatus.w b{color:#fff;text-shadow:0 0 14px var(--glow)}
.bstatus.l{border:1px solid rgba(var(--n),.4);background:rgba(0,0,0,.25);color:var(--muted)}
.bstatus.l b{color:var(--text)}
.bgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.bx{aspect-ratio:1;min-width:0;overflow:hidden;border:1px solid rgba(var(--g),.4);border-radius:3px;font-family:var(--display);font-size:.62rem;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.bx.w{background:repeating-linear-gradient(135deg,rgba(var(--g),.9) 0 2px,rgba(var(--l),.35) 2px 5px);color:#fff;border-color:var(--glow);text-shadow:0 0 4px #000}
.bx.l{border-color:rgba(255,77,109,.6);color:#ff8fa3}
.bx.f{opacity:.3}
.bx.t{outline:1px solid #fff;outline-offset:1px}
.trend{display:flex;flex-direction:column;gap:10px}
.tr{display:grid;grid-template-columns:96px 1fr 58px;gap:10px;align-items:center;font-size:.85rem}
.tr .b{height:8px;border-radius:2px;background:rgba(var(--n),.15);overflow:hidden}
.tr .b span{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow))}
.tr .n{font-family:var(--display);text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{border:1px solid rgba(var(--g),.16);border-radius:5px;padding:10px 12px;background:rgba(0,0,0,.22)}
.kv small{display:block;font-family:var(--display);font-size:.64rem;letter-spacing:.12em;color:var(--muted)}
.kv b{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tchip{border:1px solid rgba(var(--n),.4);background:transparent;color:var(--muted);border-radius:16px;padding:5px 12px;font-size:.84rem}
.tchip[aria-pressed="true"]{border-color:var(--glow);color:#fff;background:rgba(var(--l),.35)}

/* Heatmap */
.heat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:2px;background:rgba(var(--n),.12)}
.cell.l1{background:rgba(var(--l),.35)}
.cell.l2{background:rgba(var(--l),.65)}
.cell.l3{background:var(--glow);box-shadow:0 0 6px rgba(var(--g),.7)}
.cell.red{background:var(--gold);box-shadow:0 0 6px rgba(255,204,85,.6)}
.cell.miss{background:rgba(255,77,109,.35)}
.cell.rest{background:transparent;border:1px dashed rgba(255,204,85,.7)}
.cell.future{background:transparent}
.cell.today{outline:1px solid #fff;outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:.78rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .cell{width:11px;display:inline-block}
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{font-family:var(--display);letter-spacing:.08em;min-width:90px;text-align:center}
.rep h3{font-family:var(--display);font-size:.76rem;letter-spacing:.16em;color:var(--glow);margin:20px 0 10px;text-transform:uppercase}

/* Titles */
.titles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.t{text-align:left;border:1px solid rgba(var(--n),.22);border-radius:5px;padding:9px 11px;background:rgba(0,0,0,.22)}
.t b{display:block;font-family:var(--display);font-size:.88rem;letter-spacing:.04em}
.t span{font-size:.76rem;color:var(--muted)}
.t.locked{opacity:.45;cursor:default}
.t.locked b{color:var(--muted)}
.t.eq{border-color:var(--gold);box-shadow:0 0 10px rgba(255,204,85,.25)}
.t.eq b{color:var(--gold)}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(2,4,10,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.overlay.open{display:flex}
.modal{width:100%;max-width:440px;max-height:90vh;overflow:auto;animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.85);opacity:.2}to{transform:none;opacity:1}}
.modal h2{font-family:var(--display);margin:14px 0 6px;font-size:1.4rem;letter-spacing:.05em;text-wrap:balance}
.modal p{margin:8px 0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.field label{font-family:var(--display);font-size:.74rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.field input,.field select,.field textarea{background:rgba(0,0,0,.45);border:1px solid rgba(var(--g),.4);border-radius:4px;padding:10px 11px;width:100%}
.field textarea{min-height:80px}
.field textarea.mono{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem}
.suggest{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.suggest .pill{font-family:var(--display);font-size:.76rem;letter-spacing:.06em;color:var(--glow);border:1px solid rgba(var(--g),.5);border-radius:3px;padding:1px 7px;background:rgba(var(--g),.08)}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:.9rem;color:var(--muted)}
.chk input{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:flex-end}
.row .grow{margin-right:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.levelup{text-align:center}
.levelup .big{font-family:var(--display);font-weight:700;font-size:2.6rem;letter-spacing:.12em;color:#fff;text-shadow:0 0 20px var(--glow),0 0 40px var(--line);margin:8px 0 4px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 30px var(--glow),0 0 70px var(--line)}}
.levelup .from{font-family:var(--display);font-size:1.2rem;color:var(--glow)}
.modal.penalty{border-color:rgba(255,77,109,.6);box-shadow:0 0 24px rgba(255,77,109,.3)}
.modal.penalty::before,.modal.penalty::after{border-color:var(--danger)}
.modal.penalty h2{color:var(--danger);text-shadow:0 0 14px rgba(255,77,109,.6)}
.modal.penalty .tag{color:var(--danger);border-color:var(--danger);background:rgba(255,77,109,.08)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:35;background:radial-gradient(circle at 50% 40%,rgba(var(--g),.45),transparent 60%);animation:flash .9s ease forwards}
.flash.redf{background:radial-gradient(circle at 50% 40%,rgba(255,77,109,.4),transparent 60%)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.toasts{position:fixed;left:0;right:0;bottom:88px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:30;padding:0 16px}
.toast{max-width:420px;width:100%;background:rgba(6,14,32,.96);border:1px solid var(--glow);box-shadow:0 0 18px rgba(var(--l),.5);padding:10px 14px;border-radius:4px;font-size:.9rem;animation:tin .25s ease}
.toast b{font-family:var(--display);color:var(--glow);letter-spacing:.1em;font-size:.75rem;display:block}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.foot{text-align:center;font-size:.78rem;color:var(--muted)}
@media (max-width:400px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}.pp{font-size:.7rem}.wrap{padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    if(e&&e.code==="invalid_argument"){dbRef=null;syncLabel="Saved on this device only";}else syncLabel="Sync failed, saved on this device";

function adopt(remote){var m=migrate(JSON.parse(JSON.stringify(remote)));if(!m)return false;S=m;try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}return true;}
function connect(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use("sample").then(function(f){
    if(!f)return;SAMPLE=f;
    render();
  }).catch(function(){});
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(a){
    var db=a[0],user=a[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      var ref=db.doc("data/users/"+id+"/hunter");
      return ref.get().then(function(snap){
        dbRef=ref;
        var remote=snap.exists?snap.data():null;
        if(remote&&remote.v===16&&S.fresh){if(adopt(remote)){render();checkDay();}}
        else if(remote&&remote.v!==9&&remote.v!==8&&remote.v!==7&&remote.v!==6){if(S.fresh){adopt(remote);save();render();}else flush();}
        else if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){if(adopt(remote)){render();checkDay();}}
        else if(!remote||(S.updatedAt||0)>(remote.updatedAt||0)){if(S.fresh)save();else flush();}
        syncLabel="Synced to your account";setFoot();
        ref.onSnapshot(function(s){
          var d=s.exists?s.data():null;
          if(d&&(d.v>=6&&d.v<=16)&&(d.updatedAt||0)>(S.updatedAt||0)&&!s.metadata.hasPendingWrites){if(adopt(d))render();}
        },function(){});
      });
    });
  }).catch(function(){});
}

function lineChart(pts,o){
  o=o||{};if(!pts.length)return "";
  var W=320,H=170,L=38,Rr=14,T=14,B=26,iw=W-L-Rr,ih=H-T-B;
  var vals=pts.map(function(p){return p.y;});

  var span=mx-mn;if(o.min==null){mn-=span*.12;mx+=span*.12;span=mx-mn;}
  function X(i){return L+(pts.length===1?iw/2:i*iw/(pts.length-1));}

  var fmt=o.fmt||function(v){return String(span>=3?Math.round(v):Math.round(v*10)/10);};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||"Line chart")+'"><defs><linearGradient id="cg'+(o.id||"")+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:rgb(var(--g));stop-opacity:.35"/><stop offset="1" style="stop-color:rgb(var(--g));stop-opacity:0"/></linearGradient></defs>';
  for(var g=0;g<=3;g++){var gv=mn+span*g/3,gy=Y(gv);s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" style="stroke:rgba(var(--n),.16)"/><text x="'+(L-6)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="10" font-family="Chakra Petch" style="fill:var(--muted)">'+esc(fmt(gv))+'</text>';}
  if(o.base!=null){var by=Y(o.base);s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+by.toFixed(1)+'" y2="'+by.toFixed(1)+'" stroke="#ffcc55" stroke-dasharray="4 4" stroke-opacity=".7"/><text x="'+(W-Rr)+'" y="'+(by-5).toFixed(1)+'" text-anchor="end" font-size="10" fill="#ffcc55" font-family="Chakra Petch">baseline</text>';}
  var line=pts.map(function(p,i){return X(i).toFixed(1)+","+Y(p.y).toFixed(1);}).join(" ");
  if(pts.length>1)s+='<polygon points="'+X(0).toFixed(1)+','+(T+ih)+' '+line+' '+X(pts.length-1).toFixed(1)+','+(T+ih)+'" fill="url(#cg'+(o.id||"")+')"/><polyline points="'+line+'" fill="none" style="stroke:rgb(var(--g))" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  var step=Math.max(1,Math.ceil(pts.length/6));
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(last?5:3)+'" style="fill:'+(last?'#fff':'rgb(var(--g))')+(last?';stroke:rgb(var(--g))':'')+'" stroke-width="2"/>';
    if(i%step===0||last)s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" font-family="Chakra Petch" style="fill:var(--muted)">'+esc(p.x)+'</text>';
    if(o.showVals&&(last||pts.length<=6))s+='<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.y)-9).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-family="Chakra Petch" style="fill:var(--text)">'+esc(fmt(p.y))+'</text>';
  });
  return s+'</svg>';
}

function windowStats(n){
  var t=today(),out={};
  S.quests.forEach(function(q){
    if(q.archived)return;var o={q:q,days:0,full:0,mini:0};
    for(var i=1;i<=n;i++){var d=addDays(t,-i);if(d<S.created||!activeOn(q,d))continue;o.days++;var e=S.log[d]||{};if(e[q.id]){if(e["_m:"+q.id])o.mini++;else o.full++;}}
    out[q.id]=o;
  });
  return out;
}
function ruleChecks(){
  var tracked=diffDays(S.created,today()),list=[];
  if(tracked<7)return {early:true,days:tracked,list:[]};
  var ws=windowStats(14);
  S.quests.forEach(function(q){if(evoReady(q))list.push({title:q.name+" is ready to evolve",detail:"Cleared at full strength 12+ of the last 14 days. Add one small step, like +1 set."});});
  Object.keys(ws).forEach(function(k){var o=ws[k];if(isPrayer(o.q)||o.days<7)return;var rate=(o.full+o.mini)/o.days;
    if(rate<.5)list.push({title:o.q.name+" is slipping",detail:"Done "+(o.full+o.mini)+" of "+o.days+" days. Shrink the mini version or tie it to a fixed time, like right after Asar."});
    else if(o.mini>=o.days*.5)list.push({title:o.q.name+" runs on mini mode",detail:"Mini on "+o.mini+" of "+o.days+" days. Fine for now; next step is one full day a week."});});
  var pr=Object.keys(ws).map(function(k){return ws[k];}).filter(function(o){return isPrayer(o.q)&&o.days>=7;});
  if(pr.length){var worst=pr.sort(function(a,b){return a.full/a.days-b.full/b.days;})[0];if(worst.full/worst.days<.85)list.push({title:worst.q.name+" is your hardest prayer to keep on time",detail:"On time "+worst.full+" of "+worst.days+" days. Set an alarm or plan the 15 minutes before it."});}
  var B=R.battle,top=Object.keys(B.trig).sort(function(a,b){return B.trig[b]-B.trig[a];})[0];
  if(top&&B.trig[top]>=2)list.push({title:"Most battle losses: "+top,detail:"It came up "+B.trig[top]+" times. Plan one move for that moment before it happens."});
  return {early:false,list:list.slice(0,4)};
}
function aiPayload(){
  var t=today(),ws=windowStats(30),B=R.battle,m=mkey(t),pm=addMonths(m,-1);
  var lines=[];
  lines.push("Today: "+t+". Days tracked: "+(diffDays(S.created,t)+1)+". Level "+R.lvl+" ("+R.rank+"-rank). Current streak "+R.streak+", best "+R.best+".");
  lines.push("HABITS (last 30 days, days active / full / mini):");
  Object.keys(ws).forEach(function(k){var o=ws[k];if(isPrayer(o.q))return;lines.push("- "+o.q.name+" | mini: "+(o.q.mini||"none")+" | rank "+o.q.rank+" | tier "+(o.q.tier||1)+" | "+o.days+"/"+o.full+"/"+o.mini);});
  lines.push("PRAYERS (days active / on time / late):");
  Object.keys(ws).forEach(function(k){var o=ws[k];if(!isPrayer(o.q))return;lines.push("- "+o.q.name+": "+o.days+"/"+o.full+"/"+o.mini);});
  var bm=B.months[m]||{w:0},bp=B.months[pm]||null,past=S.battle.past.filter(function(p){return p.m===pm;})[0];
  lines.push("BATTLE (a personal habit they are quitting; wins = days without it): this month "+bm.w+" wins in "+parseKey(t).getDate()+" days; last month "+(bp?bp.w+" wins":past?past.w+"/"+past.n:"n/a")+"; best win streak "+B.best+"; current "+B.streak+".");
  var trig=Object.keys(B.trig).map(function(x){return x+" x"+B.trig[x];});if(trig.length)lines.push("Loss triggers: "+trig.join(", "));
  var notes=Object.keys(S.battle.notes).sort().reverse().slice(0,5).map(function(d){return d+": "+(S.battle.notes[d].text||"");}).filter(function(x){return x.length>12;});
  if(notes.length)lines.push("Recent loss notes: "+notes.join(" | "));
  var tests=S.bench.filter(function(b){return b.entries.length;}).map(function(b){return b.name+": "+b.entries.map(function(x){return x.v;}).join(" → ")+" "+b.unit;});
  if(tests.length)lines.push("REAL-WORLD TESTS: "+tests.join("; "));
  var imp=S.events.filter(function(x){return x.type==="improvement";}).slice(-6).map(function(x){return x.d+" "+x.text;});
  if(imp.length)lines.push("PAST IMPROVEMENTS: "+imp.join("; "));
  var gs=S.gates.filter(function(g){return !g.archived&&!g.done;}).map(function(g){return g.name;});
  if(gs.length)lines.push("OPEN GOALS: "+gs.join("; "));
  return lines.join("\n");
}

function monthReport(m){
  var t=today(),first=m+"-01",last=m+"-"+pad(daysIn(m)),from=first<S.created?S.created:first,to=last>t?t:last;
  var tracked=0,cleared=0,saved=0,xp=0,prayOn=0,prayDays=0,perQ={};
  if(from<=to)for(var d=from;d<=to;d=addDays(d,1)){
    var info=R.days[d];if(!info)continue;xp+=info.xp;
    if(info.req&&d<t){tracked++;if(info.state==="clear")cleared++;else if(info.state==="redeemed"||info.state==="rest"||info.state==="shield")saved++;}
    var e=S.log[d]||{};
    S.quests.forEach(function(q){if(!activeOn(q,d))return;if(isPrayer(q)){if(d<t||e[q.id]){prayDays++;if(e[q.id]&&!e["_m:"+q.id])prayOn++;}return;}
      var p=perQ[q.id]=perQ[q.id]||{q:q,full:0,mini:0,n:0};if(d<t||e[q.id])p.n++;if(e[q.id]){if(e["_m:"+q.id])p.mini++;else p.full++;}});
  }
  var bm=R.battle.months[m]||{w:0,l:0},past=null;S.battle.past.forEach(function(p){if(p.m===m)past=p;});
  var bw=bm.w,bn=m===mkey(t)?parseKey(t).getDate():daysIn(m);if(!bm.w&&!bm.l&&past){bw=past.w;bn=past.n;}
  return {tracked:tracked,cleared:cleared,saved:saved,xp:xp,prayOn:prayOn,prayDays:prayDays,perQ:perQ,bw:bw,bn:bn,hasBattle:!!(bm.w||bm.l||past),
    gates:S.gates.filter(function(g){return g.done&&mkey(g.done)===m;}),ev:S.events.filter(function(x){return mkey(x.d)===m;})};
}

function gearStats(g){
  var r={},c=g.cost||0,add=function(k,v){if(v)r[k]=(r[k]||0)+v;};
  if(g.slot==="weapon"&&g.id!=="none")add("ATK",Math.round(c/120)+4);
  if(g.slot==="outfit"&&c){add("DEF",Math.min(40,Math.round(c/700)||1));add("HP",Math.round(c/40));}
  if(g.slot==="head"&&c){add("DEF",Math.max(1,Math.round(c/1500)));add("CRIT",Math.round(c/2000));}
  if(g.slot==="arm"&&c)add("ATK",Math.round(c/250));
  if(g.slot==="aura"&&c){add("CRIT",Math.round(c/800));add("ARMY",Math.round(c/500));}
  var f=(g.slot==="weapon"?WFLAV:XFLAV)[g.id];if(f)Object.keys(f).forEach(function(k){add(k,f[k]);});
  return r;
}

function gearTotal(gear){
  var parts=[];["outfit","head","weapon","aura"].forEach(function(k){var g=GEAR_BY[gear[k]];if(g)parts.push(gearStats(g));});
  [gear.armR,gear.armL].forEach(function(a){var g=GEAR_BY[a];if(g)parts.push(gearStats(g));});

function simulate(f){
  var H=hunterBattle(),F=floorFoe(f),act=activeSkills(),has=function(id){return act.indexOf(id)>=0;};
  var dom=has("domain")?1.3:1,you=H.hp,foe=F.hp,ev=[],rnd=function(){return .85+Math.random()*.3;},meter=0,shield=has("aegis")?2:0,wind=has("secondwind");
  for(var turn=1;turn<=40&&you>0&&foe>0;turn++){
    meter+=H.spd;var hits=Math.floor(meter);meter-=hits;
    for(var k=0;k<hits&&foe>0;k++){
      var mult=1,label=null;
      if(k===0){if(has("sovereign")&&turn===1){mult=5;label="Sovereign Strike";}else if(has("heavy")&&turn%4===0){mult=2.5;label="Heavy Blow";}}
      var c=Math.random()<H.crit+(has("keen")?.15:0),d=Math.round(H.atk*mult*dom*rnd()*(c?2:1)*(k?.7:1));
      foe=Math.max(0,foe-d);ev.push({t:"you",d:d,c:c,label:label,quick:k>0,yh:you,fh:foe});
    }
    if(foe>0&&has("swift")&&turn%3===0){var d2=Math.round(H.atk*dom*rnd());foe=Math.max(0,foe-d2);ev.push({t:"you",d:d2,label:"Swift Cut",yh:you,fh:foe});}
    if(foe>0&&has("storm")&&turn%5===0){for(var z=0;z<3&&foe>0;z++){var d3=Math.round(H.atk*.8*dom*rnd());foe=Math.max(0,foe-d3);ev.push({t:"you",d:d3,label:z?null:"Blade Storm",storm:true,yh:you,fh:foe});}}
    if(foe>0&&H.army>0){for(var r=0;r<(has("legion")?2:1)&&foe>0;r++){var ad=Math.round(H.army*(has("rally")?1.5:1)*dom*rnd());foe=Math.max(0,foe-ad);ev.push({t:"army",d:ad,yh:you,fh:foe,label:r?"Legion":null});}}
    if(has("renew")&&turn%4===0&&you>0&&foe>0){var hl=Math.round(H.hp*.2);you=Math.min(H.hp,you+hl);ev.push({t:"heal",d:hl,label:"Renewal",yh:you,fh:foe});}
    if(foe>0){
      if(has("phantom")&&Math.random()<.25)ev.push({t:"foe",dodge:true,yh:you,fh:foe});
      else if(shield>0){shield--;ev.push({t:"foe",block:true,yh:you,fh:foe});}
      else{var md=Math.round(F.atk*rnd()*(1-H.def)*(has("iron")?.7:1));you=Math.max(0,you-md);
        if(you<=0&&wind){wind=false;you=Math.round(H.hp*.3);ev.push({t:"foe",d:md,yh:0,fh:foe});ev.push({t:"heal",d:you,label:"Second Wind",yh:you,fh:foe});}
        else ev.push({t:"foe",d:md,yh:you,fh:foe});}
    }
  }
  return {H:H,F:F,ev:ev,win:foe<=0&&you>0};
}

function checkDay(){
  var t=today();if(S.ack===t)return;
  var yd=addDays(t,-1),r=derive(),shieldsLeft=r.shields,penal=[],shielded=[],redQuest=null;
  r.missed.filter(function(d){return d>=S.ack&&d<yd;}).forEach(function(d){
    if(shieldsLeft>0){S.log[d]=S.log[d]||{};S.log[d]._shield=true;shieldsLeft--;shielded.push(d);}else penal.push(d);
  });
  var ys=r.days[yd];
  if(ys&&ys.state==="miss"&&!(S.log[t]&&S.log[t]._red)){
    if(heartsLeft(r,mkey(yd))>0){
      var e=S.log[yd]||{},ids=S.quests.filter(function(q){return activeOn(q,yd)&&!e[q.id];}).map(function(q){return q.id;});
      S.log[t]=S.log[t]||{};S.log[t]._red={from:yd,ids:ids};redQuest=ids.length;
    }else if(shieldsLeft>0){S.log[yd]=S.log[yd]||{};S.log[yd]._shield=true;shieldsLeft--;shielded.push(yd);}
    else penal.push(yd);
  }
  if(redQuest)notify("Penalty Quest","Yesterday wasn't cleared. Redo "+redQuest+" quest"+(redQuest>1?"s":"")+" today to redeem it.");
  if(penal.length)notify("Daily quest failed",penal.length+" day"+(penal.length>1?"s":"")+" not cleared. −"+penal.length*PENALTY_XP+" EXP.");
  if(shielded.length)notify("Streak Shield",shielded.length+" failed day"+(shielded.length>1?"s":"")+" blocked.");
  upcomingBdays().forEach(function(x){if(x.n<=1)notify(x.n?"Birthday tomorrow":"Birthday today",x.b.name+(x.n?"'s birthday is tomorrow.":"'s birthday is today."));});
  if(testsDue().show)notify("Evaluation day",testsDue().list.length+" real-world test"+(testsDue().list.length>1?"s":"")+" ready. +"+TEST_XP+" EXP each.");
  S.ack=t;save();render();
  if(redQuest){
    flash(true);play("penalty");
    openModal('<span class="tag">Penalty Quest</span><h2>Redemption available</h2><p>Yesterday wasn\'t cleared. Redo the '+redQuest+' missed quest'+(redQuest>1?'s':'')+' today, on top of today\'s, and yesterday counts as redeemed.</p>'+
      '<p>Hearts left in '+esc(monthName(mkey(yd)))+': '+heartsLeft(derive(),mkey(yd))+' of '+HEARTS+'.</p>'+
      (penal.length?'<p>Earlier failed days: '+penal.length+' (−'+penal.length*PENALTY_XP+' EXP).</p>':'')+
      '<div class="row"><button class="btn danger" data-a="close">Accept quest</button></div>','penalty');
  }else if(penal.length){
    flash(true);play("penalty");
    openModal('<span class="tag">Warning</span><h2>Daily quest failed</h2><p>'+penal.length+' day'+(penal.length>1?'s were':' was')+' not cleared with no hearts left. −'+(penal.length*PENALTY_XP)+' EXP, streak reset.</p><p>No failure, only feedback. Today is a fresh start.</p><div class="row"><button class="btn danger" data-a="close">Accept</button></div>','penalty');
  }else if(shielded.length){
    play("shield");
    openModal('<span class="tag">System</span><h2>Streak Shield activated</h2><p>A shield blocked '+shielded.length+' failed day'+(shielded.length>1?'s':'')+'. Your streak is safe.</p><div class="row"><button class="btn primary" data-a="close">Continue</button></div>');
  }
}

  else if(a==="tryon"){var gt=GEAR_BY[id];if(gt){if(!view.trial)view.trial=JSON.parse(JSON.stringify(S.gear));if(TOGGLES.indexOf(gt.slot)>=0)view.trial[gt.slot]=true;else if(gt.slot==="arm"){view.trial.armR=gt.id;view.trial.armL=gt.id;}else view.trial[gt.slot]=gt.id;closeModal();view.tab="hunter";render();window.scrollTo(0,0);play("notify");toast("Trying on",gt.name+". Not bought yet.");}}
  else if(a==="endtrial"){view.trial=null;render();}
  else if(a==="equip"){var g3=GEAR_BY[id];var sd3=b.getAttribute("data-side");if(g3&&sd3&&g3.slot!=="arm")S.gear.weaponSide=sd3;
    if(g3&&g3.slot==="arm"&&owns(id)){if(sd3==="right"||sd3==="both")S.gear.armR=id;if(sd3==="left"||sd3==="both")S.gear.armL=id;view.trial=null;save();closeModal();render();play("notify");return;}if(g3&&owns(id)){view.trial=null;equip(g3);save();closeModal();render();play("notify");}}
  else if(a==="addr")rewardForm();
  else if(a==="editr")rewardForm(find(S.rewards,id));
  else if(a==="delr"){var ri=find(S.rewards,id);if(ri)S.rewards.splice(S.rewards.indexOf(ri),1);save();closeModal();render();}
  else if(a==="buyr"){var rw=find(S.rewards,id);if(rw)confirmBuy(rw.name,rw.cost,"buyr2",id);}
  else if(a==="buyr2"){var rw2=find(S.rewards,id);if(rw2)purchase("reward",id,rw2.name,rw2.cost);}
  else if(a==="buyi")confirmBuy(ITEMS[id].name,ITEMS[id].cost,"buyi2",id);
  else if(a==="buyi2")purchase("item",id,ITEMS[id].name,ITEMS[id].cost);
  else if(a==="buyt"&&!rankOK(THEMES[id].req,R.lvl))return;
  else if(a==="buyt")confirmBuy(THEMES[id].name+" theme",THEMES[id].cost,"buyt2",id);
  else if(a==="buyt2"){if(purchase("theme",id,THEMES[id].name+" theme",THEMES[id].cost)){S.themes.push(id);S.theme=id;save();render();}}
  else if(a==="usetheme"){if(S.themes.indexOf(id)<0&&THEMES[id].cost)return;S.theme=id;save();render();play("open");}
  else if(a==="usepotion"){if(R.potions<1)return;before=derive();S.log[t]=S.log[t]||{};S.log[t]._boost=true;flash();afterChange(before,"EXP Potion","1.5× EXP and gold for the rest of today.","shield");}
  else if(a==="refund"){
    var p=S.purchases[S.purchases.length-1];if(!p||p.d!==t)return;
    if(p.kind==="item"&&((p.ref==="shield"&&R.shields<1)||(p.ref==="potion"&&R.potions<1))){toast("System","That item was already used.");play("error");return;}
    S.purchases.pop();
    if(p.kind==="theme"){S.themes=S.themes.filter(function(x){return x!==p.ref;});if(S.theme===p.ref)S.theme="azure";}
    if(p.kind==="army"&&S.army[p.ref])S.army[p.ref]--;
    if(p.kind==="shup"&&S.shTier)S.shTier[p.ref]=Math.max(1,(p.tier||2)-1);
    if(p.kind==="set"&&p.parts){S.owned=S.owned.filter(function(x){return p.parts.indexOf(x)<0;});p.parts.forEach(function(pid){var gr0=GEAR_BY[pid];if(!gr0)return;if(gr0.slot==="arm"){if(S.gear.armR===pid)S.gear.armR="noarm";if(S.gear.armL===pid)S.gear.armL="noarm";}else if(TOGGLES.indexOf(gr0.slot)>=0)S.gear[gr0.slot]=false;else if(S.gear[gr0.slot]===pid)S.gear[gr0.slot]=({outfit:"bare",head:"nohead",weapon:"none",aura:"noaura",bg:"grid"})[gr0.slot]||S.gear[gr0.slot];});}
    if(p.kind==="gear"){S.owned=S.owned.filter(function(x){return x!==p.ref;});var gr=GEAR_BY[p.ref];if(gr){if(gr.slot==="arm"){if(S.gear.armR===p.ref)S.gear.armR="noarm";if(S.gear.armL===p.ref)S.gear.armL="noarm";}else if(TOGGLES.indexOf(gr.slot)>=0)S.gear[gr.slot]=false;else if(S.gear[gr.slot]===p.ref)S.gear[gr.slot]=GEAR.filter(function(x){return x.slot===gr.slot&&x.cost===0;})[0].id;}}
    save();render();play("undo");toast("System",p.name+" refunded.");
  }
  else if(a==="addb")benchForm();
  else if(a==="editb")benchForm(find(S.bench,id));
  else if(a==="benchview"){var bv=find(S.bench,id);if(bv)benchView(bv);}
  else if(a==="delb"){var bi=find(S.bench,id);if(bi){before=derive();S.bench.splice(S.bench.indexOf(bi),1);closeModal();afterChange(before,"System","Test removed.","undo");}}
  else if(a==="undob"){var bu=find(S.bench,id);if(bu&&bu.entries.length){before=derive();var x=bu.entries.pop();if(x.r&&S.log[x.d])delete S.log[x.d]["b:"+bu.id];closeModal();afterChange(before,"System","Last result removed.","undo");}}
  else if(a==="analyze")analyze();
  else if(a==="evalday"){openModal('<span class="tag">Test day</span><p>Pick the day the Evaluation reminder appears on your Quests tab. Tests overdue by 10+ days also show up any day.</p><div class="field"><label for="ed">Day</label><select id="ed">'+DAYS.map(function(d,i){return '<option value="'+i+'"'+(i===(+S.evalDay||0)?' selected':'')+'>'+d+'</option>';}).join("")+'</select></div><div class="row"><button class="btn ghost" data-a="close">Cancel</button><button class="btn primary" data-a="saveevalday">Save</button></div>');play("open");}
  else if(a==="saveevalday"){S.evalDay=+document.getElementById("ed").value;save();closeModal();render();play("notify");}
  else if(a==="advok"){
    var A=S.advice,it2=A&&A.items[+id];if(!it2)return;
    var tq=it2.qid&&find(S.quests,it2.qid),txt=it2.title+": "+it2.detail;
    if(tq&&it2.newName){var old=tq.name;tq.name=it2.newName;if(it2.newMini)tq.mini=it2.newMini;tq.lastUp=t;tq.tier=(tq.tier||1)+1;txt=old+" → "+tq.name+" (System suggestion)";}
    S.events.push({id:uid(),d:t,type:"improvement",text:txt.slice(0,240),auto:!!(tq&&it2.newName)});it2.state="accepted";
    save();render();play("clear");toast("Improvement saved",tq&&it2.newName?"Quest updated and logged.":"Added to your log.");
  }
  else if(a==="advno"){var A2=S.advice,it3=A2&&A2.items[+id];if(it3){it3.state="dismissed";save();render();play("undo");}}
  else if(a==="addlog")entryForm();
  else if(a==="editlog")entryForm(find(S.events,id));
  else if(a==="dellog"){var ei=find(S.events,id);if(ei)S.events.splice(S.events.indexOf(ei),1);save();closeModal();render();play("undo");}
  else if(a==="alllog"){view.allLog=true;render();}
  else if(a==="addbday")bdayForm();
  else if(a==="delbday"){var bdi=find(S.bdays,id);if(bdi)S.bdays.splice(S.bdays.indexOf(bdi),1);save();render();play("undo");}
  else if(a==="mprev"){view.month=addMonths(view.month,-1);play("tab");render();}
  else if(a==="mnext"){if(view.month<mkey(t)){view.month=addMonths(view.month,1);play("tab");render();}}
  else if(a==="sound"){S.sound=!S.sound;save();render();if(S.sound)play("notify");}
  else if(a==="hidemig"){delete S.migratedNote;save();render();}
  else if(a==="settings")settings();
  else if(a==="savename"){var n=document.getElementById("f-hn").value.trim();if(n){S.name=n;save();render();}closeModal();}
  else if(a==="copybk"){var ta=document.getElementById("f-bk");try{navigator.clipboard.writeText(ta.value).then(function(){toast("System","Backup copied.");},function(){ta.select();toast("System","Select the text and copy it manually.");});}catch(x){ta.select();}}
  else if(a==="restore"){try{var o=migrate(JSON.parse(document.getElementById("f-bk").value));if(!o)throw 0;delete o.fresh;S=o;save();closeModal();render();toast("System","Backup restored.");}catch(x){toast("Restore failed","That text is not a Hunter System backup.");play("error");}}
  else if(a==="resetprog"){openModal('<span class="tag">Start fresh</span><h2>Reset progress, keep habits?</h2><p>Your quests, gates, plans, weekly targets, rewards list and reminders stay. Level, EXP, gold, streak, stats, gear, themes, titles, shadow army, dungeon and history go back to zero, starting today.</p><div class="row"><button class="btn ghost" data-a="close">Cancel</button><button class="btn danger" data-a="resetprog2">Start fresh today</button></div>','penalty');}
  else if(a==="resetprog2"){var t0=today(),keepQ=S.quests.filter(function(q){return !q.archived;}).map(function(q){var c=JSON.parse(JSON.stringify(q));c.created=t0;c.lastUp=t0;c.tier=1;delete c.snooze;if(c.amt!=null)c.progStart=t0;if(c.days)c.daysFrom=t0;return c;}),keepG=S.gates.filter(function(g){return !g.done;}).map(function(g){var c=JSON.parse(JSON.stringify(g));c.created=t0;return c;});
    var n=seed({name:S.name,sound:S.sound,look:S.look,battle:{label:S.battle&&S.battle.label},rewards:S.rewards,bench:S.bench,evalDay:S.evalDay});
    n.quests=keepQ;n.gates=keepG;n.reminders=S.reminders;n.claudeChat=S.claudeChat;n.tourDone=S.tourDone;n.matchTheme=S.matchTheme;n.bdays=S.bdays||[];delete n.fresh;delete n.migratedNote;
    S=n;save();closeModal();view.tab="quests";render();window.scrollTo(0,0);toast("System","Day 1. A new hunter awakens.");play("level");}
  else if(a==="reset"){openModal('<span class="tag">Reset</span><h2>Erase all progress?</h2><p>Level, gold, gear, stats, battle record and log will be deleted. Your name, look and birthdays stay.</p><div class="row"><button class="btn ghost" data-a="close">Keep my progress</button><button class="btn danger" data-a="reset2">Erase everything</button></div>','penalty');}
  else if(a==="reset2"){S=seed({name:S.name,bdays:S.bdays,sound:S.sound,look:S.look,battle:S.battle,rewards:S.rewards,bench:S.bench,evalDay:S.evalDay});save();closeModal();render();toast("System","A new hunter awakens.");play("level");}
  else if(a==="close")closeModal();
}

/* ---------- Boot ---------- */
var TABS=["quests","battle","hunter","dungeon","store","insights"];
var h0=(location.hash||"").slice(1);if(TABS.indexOf(h0)>=0)view.tab=h0;
window.addEventListener("hashchange",function(){var x=(location.hash||"").slice(1);if(TABS.indexOf(x)>=0&&x!==view.tab){view.tab=x;render();}});
var lastDay=today();
setInterval(function(){
  var t=today();if(t!==lastDay){lastDay=t;render();checkDay();return;}
  var cd=document.getElementById("cd");if(cd)cd.textContent="Resets in "+countdown();
},1000);
try{if(S.fresh)localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
render();checkDay();connect();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
if(!S.tourDone)setTimeout(function(){if(!ov.classList.contains('open'))showTutorial(0);else{var iv=setInterval(function(){if(!ov.classList.contains('open')&&!S.tourDone){clearInterval(iv);showTutorial(0);}else if(S.tourDone)clearInterval(iv);},800);}},600);
})();
</script>
</body>
